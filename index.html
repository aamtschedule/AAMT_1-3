<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script>(function(){try{var t=localStorage.getItem('theme');if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;document.documentElement.dataset.bsTheme=t}catch(e){document.documentElement.dataset.theme='dark';document.documentElement.dataset.bsTheme='dark'}})();</script>
    <title>Naap Schedule</title>
    <link rel="icon" type="image/png" href="new_main_icon-RAW.png">
    <link rel="manifest" href="manifest_index.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Schedule">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="vendor/bootstrap.min.css">
    <link rel="stylesheet" href="vendor/bootstrap-icons.min.css">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #050a15;
            --header: #0f1d38;
            --accent: #ffffff;
            --text: #e8f0ff;
            --muted: #8099cc;
            --grid: #374d86;
            --cell: #0a1428;
            --card: #0f1e42;
            --radius: 16px;
            --ov: 255, 255, 255;
            --on-accent: #050a15
        }

        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f1f5fb;
            --header: #ffffff;
            --accent: #1749b5;
            --text: #101b32;
            --muted: #52627d;
            --grid: #aab9d0;
            --cell: #ffffff;
            --card: #ffffff;
            --ov: 15, 29, 56;
            --on-accent: #ffffff
        }

        :root[data-theme="light"] .widget {
            box-shadow: 0 8px 32px rgba(15, 29, 56, .15), inset 0 0 0 1px rgba(15, 29, 56, .08)
        }

        .offline-pill {
            display: none;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .8px;
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, .5);
            border-radius: 4px;
            padding: 2px 5px
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text);
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: transparent
        }

        .widget {
            background: var(--bg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .6), inset 0 0 0 1px rgba(var(--ov), .07)
        }

        .widget-header {
            background: var(--header);
            padding: 10px 14px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--accent);
            flex-shrink: 0
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 1px
        }

        .schedule-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--text);
            line-height: 1.1
        }

        .schedule-subtitle {
            font-size: 10px;
            color: var(--muted);
            margin-bottom: 6px
        }

        .subtitle-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px
        }

        .subtitle-row .schedule-subtitle {
            margin-bottom: 0
        }

        .sem-switch {
            display: inline-flex;
            gap: 1px;
            padding: 1px;
            border: 1px solid rgba(128, 128, 128, .35);
            border-radius: 999px
        }

        .sem-btn {
            font: inherit;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 7px;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: var(--muted);
            cursor: pointer
        }

        .sem-btn.active {
            background: var(--text);
            color: var(--bg)
        }

        .day-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--accent)
        }

        .date-label {
            font-size: 18px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -.3px;
            line-height: 1.1
        }

        .time-now {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            text-align: right
        }

        .time-now .time-main {
            font-size: 15px;
            color: var(--text);
            display: block
        }

        .time-now .time-secs {
            font-size: 11px;
            color: var(--muted);
            display: block;
            margin-top: 1px
        }

        .next-badge {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .8px;
            text-transform: uppercase;
            background: rgba(240, 165, 0, .15);
            color: var(--accent);
            border: 1px solid rgba(240, 165, 0, .3);
            border-radius: 4px;
            padding: 2px 5px;
            margin-top: 3px;
            display: inline-block
        }

        .current-banner {
            margin: 10px 10px 0;
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden
        }

        .current-banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background: currentColor;
            opacity: .12
        }

        .current-banner.vacant-banner {
            border: 1px dashed var(--muted)
        }

        .current-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            animation: pulse 1.8s ease-in-out infinite
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1)
            }

            50% {
                opacity: .5;
                transform: scale(.75)
            }
        }

        .current-info {
            flex: 1;
            min-width: 0
        }

        .current-tag {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: .7;
            margin-bottom: 2px
        }

        .current-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .current-desc {
            font-size: 11px;
            font-weight: 500;
            opacity: .75;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .current-time {
            font-size: 10px;
            font-weight: 600;
            opacity: .6;
            text-align: right;
            flex-shrink: 0;
            line-height: 1.5
        }

        .progress-bar-wrap {
            margin: 6px 10px 0;
            height: 3px;
            background: rgba(var(--ov), .06);
            border-radius: 3px;
            overflow: hidden;
            flex-shrink: 0
        }

        .progress-bar {
            height: 100%;
            border-radius: 3px;
            transition: width .5s ease
        }

        .day-tabs {
            display: flex;
            gap: 4px;
            padding: 8px 10px 0;
            flex-shrink: 0
        }

        .day-tab {
            flex: 1;
            padding: 5px 2px;
            border: none;
            border-radius: 7px;
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .6px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background .15s, color .15s, transform .1s;
            background: rgba(var(--ov), .06);
            color: var(--muted)
        }

        .day-tab:hover {
            background: rgba(var(--ov), .12);
            color: var(--text)
        }

        .day-tab.active-today {
            background: rgba(var(--ov), .16);
            color: var(--text);
            outline: 1px solid rgba(var(--ov), .25)
        }

        .day-tab.selected {
            background: var(--accent);
            color: var(--on-accent)
        }

        .day-tab:active {
            transform: scale(.96)
        }

        .viewing-banner {
            margin: 4px 10px 0;
            padding: 4px 10px;
            background: rgba(var(--ov), .05);
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: .4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0
        }

        .viewing-banner button {
            background: none;
            border: none;
            font-size: 9px;
            color: var(--muted);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            text-decoration: underline;
            padding: 0
        }

        .viewing-banner button:hover {
            color: var(--text)
        }

        .classes-label {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--muted);
            padding: 8px 12px 4px;
            flex-shrink: 0
        }

        .classes-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 0
        }

        .classes-list::-webkit-scrollbar {
            display: none
        }

        .class-card {
            display: flex;
            align-items: stretch;
            gap: 0;
            border-radius: 10px;
            overflow: hidden;
            background: var(--card);
            border: 1px solid rgba(var(--ov), .06);
            flex-shrink: 0;
            transition: opacity .2s
        }

        .class-card.past {
            opacity: .38
        }

        .class-card.now {
            border-color: rgba(var(--ov), .15);
            box-shadow: 0 0 0 1px var(--color) inset
        }

        .card-bar {
            width: 4px;
            flex-shrink: 0
        }

        .card-body {
            flex: 1;
            padding: 8px 10px;
            min-width: 0
        }

        .card-top {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 2px
        }

        .card-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px
        }

        .card-time {
            font-size: 10px;
            font-weight: 500;
            color: var(--muted);
            white-space: nowrap;
            flex-shrink: 0
        }

        .card-desc {
            font-size: 11px;
            font-weight: 500;
            color: var(--text);
            opacity: .75;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 3px
        }

        .card-room {
            font-size: 10px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .card-instructor {
            font-size: 10px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .card-dur {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: .3px;
            opacity: .5;
            flex-shrink: 0;
            margin-left: auto
        }

        .class-card.vacant-card {
            background: repeating-linear-gradient(135deg, rgba(var(--ov), .035) 0px, rgba(var(--ov), .035) 4px, transparent 4px, transparent 8px), var(--card);
            border-style: dashed
        }

        .vacant-bar {
            background: var(--muted)
        }

        .vacant-id {
            color: var(--muted);
            font-style: italic
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: var(--muted);
            padding: 20px;
            text-align: center
        }

        .empty-state .msg {
            font-size: 12px;
            font-weight: 500;
            opacity: .6
        }

        .empty-state .sub {
            font-size: 10px;
            opacity: .35
        }

        .widget-footer {
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(var(--ov), .05);
            flex-shrink: 0
        }

        .footer-title {
            font-size: 9px;
            font-weight: 600;
            color: var(--muted);
            opacity: .5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60%
        }

        .reload-btn {
            background: none;
            border: none;
            font-size: 10px;
            color: var(--muted);
            opacity: .4;
            cursor: pointer;
            padding: 2px 4px;
            font-family: 'Inter', sans-serif
        }

        .reload-btn:active {
            opacity: .8
        }

        .assign-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: .5px;
            text-transform: uppercase;
            border-radius: 3px;
            padding: 1px 4px;
            color: #fff;
            flex-shrink: 0
        }

        .assign-badge.due-soon {
            background: rgba(255, 80, 80, .85)
        }

        .assign-badge.due-later {
            background: rgba(240, 165, 0, .75)
        }

        .assign-badge.due-ok {
            background: rgba(98, 255, 98, 0.7)
        }

        .assign-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: currentColor
        }

        .week-grid-wrap {
            padding: 0 10px 10px;
            border-top: 1px solid rgba(var(--ov), .05);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        .week-grid-handle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 2px 4px;
            cursor: ns-resize;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            flex-shrink: 0
        }

        .week-grid-handle:hover .handle-bar,
        .week-grid-handle:active .handle-bar {
            background: var(--accent);
            opacity: 1
        }

        .week-grid-title {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--muted);
            pointer-events: none
        }

        .handle-bar {
            width: 36px;
            height: 3px;
            border-radius: 3px;
            background: var(--muted);
            opacity: .4;
            transition: opacity .15s, background .15s
        }

        .handle-hint {
            font-size: 8px;
            color: var(--muted);
            opacity: .35;
            pointer-events: none;
            letter-spacing: .3px
        }

        .week-grid-scroll {
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            border-radius: 8px;
            scroll-behavior: smooth;
            flex: 1;
            min-height: 0;
            scrollbar-width: none;
            -ms-overflow-style: none
        }

        .week-grid-scroll::-webkit-scrollbar {
            display: none
        }

        .week-grid {
            position: relative;
            display: grid;
            grid-template-columns: 60px repeat(6, 1fr);
            grid-template-rows: 20px repeat(28, 16px);
            gap: 2px;
            font-size: 8px
        }

        .grid-cell {
            border-radius: 3px;
            background: rgba(var(--ov), .04);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted)
        }

        .grid-head {
            font-weight: 700;
            background: rgba(var(--ov), .08);
            cursor: pointer;
            transition: background .15s, color .15s
        }

        .grid-head:hover {
            background: rgba(var(--ov), .18);
            color: var(--text)
        }

        .grid-time {
            font-size: 10px;
            justify-content: flex-start;
            padding-left: 4px;
            white-space: nowrap;
            transition: color .2s
        }

        .grid-time.now-time {
            color: var(--accent);
            font-weight: 700
        }

        .grid-class {
            color: white;
            font-size: 8px;
            font-weight: 700;
            line-height: 1.25;
            text-align: center;
            overflow: hidden;
            padding: 1px 2px
        }

        .grid-today.grid-head {
            background: rgba(240, 165, 0, .2);
            color: var(--accent);
            outline: 1px solid var(--accent)
        }

        .grid-cell.grid-today:not(.grid-class):not(.grid-head) {
            background: rgba(240, 165, 0, .07)
        }

        .grid-class.grid-today {
            box-shadow: 0 0 0 1px rgba(var(--ov), .35) inset;
            filter: saturate(1.15)
        }

        .grid-class.now-block {
            box-shadow: 0 0 0 1.5px #fff inset, 0 0 6px rgba(var(--ov), .55);
            animation: nowPulse 1.6s ease-in-out infinite;
            z-index: 2
        }

        .grid-vacant {
            background: repeating-linear-gradient(135deg, rgba(var(--ov), .035) 0px, rgba(var(--ov), .035) 4px, transparent 4px, transparent 8px);
            color: var(--muted);
            font-size: 8px;
            font-weight: 700;
            letter-spacing: .4px;
            text-transform: uppercase;
            opacity: .6
        }

        .grid-selected-day.grid-head {
            background: rgba(var(--ov), .28);
            color: var(--on-accent);
            outline: 1px solid #fff
        }

        .grid-cell.grid-selected-day:not(.grid-class):not(.grid-head) {
            background: rgba(var(--ov), .04)
        }

        @keyframes nowPulse {

            0%,
            100% {
                filter: brightness(1) saturate(1.15)
            }

            50% {
                filter: brightness(1.3) saturate(1.3)
            }
        }

        .now-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 0;
            border-top: 1.5px dashed var(--accent);
            z-index: 5;
            pointer-events: none;
            display: none
        }

        .view-toggle-btn {
            background: rgba(var(--ov), .08);
            border: 1px solid rgba(var(--ov), .15);
            color: var(--text);
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .6px;
            text-transform: uppercase;
            cursor: pointer;
            padding: 3px 8px;
            transition: background .15s;
            flex-shrink: 0
        }

        .view-toggle-btn:hover {
            background: rgba(var(--ov), .16)
        }

        .view-toggle-btn.active {
            background: var(--accent);
            color: var(--on-accent);
            border-color: var(--accent)
        }

        .week-grid-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 2px;
            flex-shrink: 0
        }

        .calendar-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden
        }

        .cal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px 6px;
            flex-shrink: 0
        }

        .cal-nav-btn {
            background: none;
            border: 1px solid rgba(var(--ov), .12);
            color: var(--muted);
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            padding: 2px 9px;
            transition: background .15s, color .15s;
            line-height: 1
        }

        .cal-nav-btn:hover {
            background: rgba(var(--ov), .1);
            color: var(--text)
        }

        .cal-month-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: .4px
        }

        .cal-grid-wrap {
            padding: 0 8px 6px;
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 0
        }

        .cal-dow-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            margin-bottom: 3px;
            flex-shrink: 0
        }

        .cal-dow {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .8px;
            text-transform: uppercase;
            color: var(--muted);
            text-align: center;
            padding: 3px 0
        }

        .cal-days-grid {
            display: grid; grid-template-columns: repeat(7, minmax(0,1fr));
            grid-template-rows: repeat(6, minmax(34px, 1fr)); gap: 3px;
            flex: 1; min-height: 0; overflow: auto; align-content: stretch
        }

        .cal-day {
            border-radius: 6px;
            background: rgba(var(--ov), .04);
            border: 1px solid rgba(var(--ov), .04);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 2px 3px;
            cursor: pointer;
            transition: background .12s, border-color .12s;
            position: relative;
            min-height: 34px; overflow: hidden
        }

        .cal-day:hover {
            background: rgba(var(--ov), .1);
            border-color: rgba(var(--ov), .15)
        }

        .grid-closed-day { background:rgba(130,136,146,.18)!important; color:var(--muted)!important; }
        .grid-closure-label { display:block; font-size:6px; line-height:1.1; color:var(--muted); font-weight:800; }
        .grid-class-closed { filter:grayscale(1); opacity:.48; }
        .cal-day.day-closed { background: rgba(130,136,146,.22); color: var(--muted); }
        .cal-day.day-closed .cal-day-num { text-decoration: line-through; opacity:.75; }
        .cal-day.today {
            border-color: var(--accent);
            background: rgba(var(--ov), .08)
        }

        .cal-day.selected {
            background: rgba(var(--ov), .18);
            border-color: var(--accent)
        }

        .cal-day.other-month {
            opacity: .3
        }

        .cal-day.has-class {
            border-color: rgba(100, 150, 255, .35)
        }

        .cal-day-num {
            font-size: 10px;
            font-weight: 700;
            color: var(--text);
            line-height: 1
        }

        .grid-closed-day { background:rgba(130,136,146,.18)!important; color:var(--muted)!important; }

    <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content"><div class="modal-header" id="dmHead"></div><div class="modal-body" id="dmBody"></div></div></div></div>
    <script src="vendor/bootstrap.bundle.min.js"></script>
    <script src="schedule-data.js"></script>
    <script>
        /* Semester switcher: 2nd sem is the default every time the app opens */
        const SEMESTERS = { 1: SEM1_DATA, 2: SEM2_DATA };
        let currentSem = 2;
        let scheduleData = SEMESTERS[currentSem];
        try { window._fbEvents = JSON.parse(localStorage.getItem('cachedEvents') || '[]'); window._fbSubjects = JSON.parse(localStorage.getItem('cachedSubjects') || '[]'); window._fbSessions = JSON.parse(localStorage.getItem('cachedSessions') || '[]'); window._fbCancellations = JSON.parse(localStorage.getItem('cachedCancellations') || '[]'); window._fbDayClosures = JSON.parse(localStorage.getItem('cachedDayClosures') || '[]'); } catch(e) {}
        function setSemester(n) {
            if (!SEMESTERS[n] || n === currentSem) return;
            currentSem = n; scheduleData = SEMESTERS[n];
            document.querySelectorAll('.sem-btn').forEach(b => b.classList.toggle('active', +b.dataset.sem === n));
            buildTabs(); refresh(); renderWeekGrid();
            if (bottomView === 'calendar') renderCalendar2(); renderTasks();
            requestAnimationFrame(() => scrollToNow(true));
        }

        const WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
        const DAY_MAP = { 0: 'Sun', 1: 'Mon', 2: 'Tue', 3: 'Wed', 4: 'Thu', 5: 'Fri', 6: 'Sat' }
        const DAY_FULL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday']
        const MONTH = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
        const MONTH_FULL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']

        let selectedDay = null
        let bottomView = 'timetable'
        let calYear = new Date().getFullYear()
        let calMonth = new Date().getMonth()
        let calSelectedDate = null

        /* ── TBA helpers ── */
        function isTBA(c) { return c.startH === 'TBA' || c.startH === undefined || c.startH === null }
        function safeToMins(c) { return isTBA(c) ? 9999 : toMins(c.startH, c.startM) }
        function safeEndMins(c) { return isTBA(c) ? 9999 : toMins(c.endH, c.endM) }
        function fmtTime(c) { return isTBA(c) ? 'Time TBA' : `${fmt12(c.startH, c.startM)} – ${fmt12(c.endH, c.endM)}` }
        function fmtDur(c) { return isTBA(c) ? 'TBA' : durStr(c.startH, c.startM, c.endH, c.endM) }

        function semIds(n) { return new Set(SEMESTERS[n].courses.map(c => c.id)) }
        function inSem(e) { return !e.subjectId || !semIds(currentSem === 1 ? 2 : 1).has(e.subjectId) }
        function loadEvents() { return (window._fbEvents || JSON.parse(localStorage.getItem('cachedEvents') || '[]')).filter(inSem) }
        function loadSessions() { return window._fbSessions || JSON.parse(localStorage.getItem('cachedSessions') || '[]') }

        /* ── Merge built-in timetable with Firestore session overrides/custom sessions/cancellations ── */
        function getEffectiveCourses(forDate = null) {
            const overridesBySlot = {};
            const customSessions = [];
            loadSessions().forEach(o => {
                if (o.slotId) overridesBySlot[o.slotId] = o; else customSessions.push(o);
            });
            const merged = [];
            scheduleData.courses.forEach(c => {
                const o = overridesBySlot[c.slotId];
                if (!o) { merged.push({...c,_sessionKey:c.slotId}); return; }
                if (o.hidden) return;
                const tba = o.day === 'TBA';
                merged.push({
                    id: c.id, desc: c.desc, color: c.color, slotId: c.slotId, _sessionKey:c.slotId, sessionType: o.sessionType || (/lab|hangar|workshop|fabrication|simulation/i.test(o.room || c.room || '') ? 'lab' : 'lecture'),
                    room: (o.room !== undefined && o.room !== '') ? o.room : c.room,
                    days: [o.day || c.days[0]],
                    startH: tba ? 'TBA' : (o.startH !== undefined && o.startH !== null ? o.startH : c.startH),
                    startM: tba ? 'TBA' : (o.startM !== undefined && o.startM !== null ? o.startM : c.startM),
                    endH: tba ? 'TBA' : (o.endH !== undefined && o.endH !== null ? o.endH : c.endH),
                    endM: tba ? 'TBA' : (o.endM !== undefined && o.endM !== null ? o.endM : c.endM)
                });
            });
            customSessions.forEach(o => {
                if (semIds(currentSem === 1 ? 2 : 1).has(o.courseId)) return;
                const tba = !o.day || o.day === 'TBA';
                const meta = getSubjectMeta(o.courseId);
                merged.push({
                    id: o.courseId, desc: meta.desc, color: meta.color, _sessionKey:o.id, room: o.room || 'TBA', sessionType:o.sessionType || (/lab|hangar|workshop|fabrication|simulation/i.test(o.room||'')?'lab':'lecture'),
                    days: [tba ? 'TBA' : o.day],
                    startH: tba ? 'TBA' : o.startH, startM: tba ? 'TBA' : o.startM,
                    endH: tba ? 'TBA' : o.endH, endM: tba ? 'TBA' : o.endM
                });
            });
            const visible = merged.filter(c => !getSubjectMeta(c.id).noMoreClasses);
            if (!forDate) return visible;
            // A whole-day closure hides every class for this date only.
            if (getClosure(forDate)) return [];
            const cancelled = new Set((window._fbCancellations || []).filter(x=>x.date===forDate).map(x=>x.sessionKey));
            return visible.filter(c=>!cancelled.has(c._sessionKey));
        }

        function todayKey() { return DAY_MAP[new Date().getDay()] }
        function toMins(h, m) { return h * 60 + m }
        function fmt12(h, m) { const a = h < 12 ? 'AM' : 'PM'; const h2 = h % 12 === 0 ? 12 : h % 12; return `${h2}:${String(m).padStart(2, '0')} ${a}` }
        function durStr(sH, sM, eH, eM) { const mins = toMins(eH, eM) - toMins(sH, sM); const h = Math.floor(mins / 60), m = mins % 60; return h > 0 ? (m > 0 ? `${h}h ${m}m` : `${h}h`) : `${m}m` }
        function minsToWords(t) { t = Math.max(0, Math.round(t)); const h = Math.floor(t / 60), m = t % 60; const hp = h > 0 ? `${h}h` : ''; const mp = m > 0 ? `${m}m` : ''; return (hp && mp) ? `${hp} ${mp}` : hp || mp || '<1m' }
        function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') }
        function dateKey(y, mo, d) { return `${y}-${String(mo + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}` }

        function loadSubjects() { return window._fbSubjects || [] }
        /* Firestore "subjects" docs can override desc/color and add an instructor
           name for any subject id, and can also introduce a brand-new subject
           that has no schedule slot yet (used just for tagging). */
        function getSubjectMeta(subjectId) {
            const override = loadSubjects().find(s => (s.courseId || s.id) === subjectId);
            const base = scheduleData.courses.find(x => x.id === subjectId);
            return {
                desc: (override && override.desc) || (base && base.desc) || subjectId,
                color: (override && override.color) || (base && base.color) || '#8099cc',
                instructor: (override && override.instructor) || '',
                instructorLecture: (override && (override.instructorLecture || override.lectureInstructor)) || (override && override.instructor) || '',
                instructorLab: (override && (override.instructorLab || override.labInstructor)) || '',
                classMode: (override && override.classMode) || 'legacy',
                noMoreClasses: !!(override && override.noMoreClasses)
            }
        }
        function getSubjectColor(subjectId) { return getSubjectMeta(subjectId).color }
        function getEventsForDate(dk) { return loadEvents().filter(e => e.deadline === dk || e.eventDate === dk) }
        function closureApplies(x, dk) { if (x.date === dk) return true; if (x.repeat === 'weekly' && x.date && dk >= x.date && (!x.repeatUntil || dk <= x.repeatUntil)) { const a=new Date(x.date+'T00:00:00'), b=new Date(dk+'T00:00:00'); return a.getDay()===b.getDay(); } return false; }
        function getClosure(dk) { return (window._fbDayClosures || []).find(x => closureApplies(x, dk)); }
        /* sessionKey identifies one specific class meeting, e.g. "Thu|13:30", so
           that a subject meeting twice on the same day (morning + evening) can
           have an assignment/reminder tagged to just one of the sessions.
           When an item has no sessionKey it applies to every session of that subject. */
        function getEventsForSubject(subjectId, sessionKey) {
            const events = loadEvents();
            const now = new Date();
            return events.filter(e =>
                e.subjectId === subjectId &&
                (e.type === 'assignment' || e.type === 'reminder') &&
                e.deadline && new Date(e.deadline + ' 23:59') >= now && !doneSet().has(e.id) &&
                (!e.sessionKey || e.sessionKey === sessionKey)
            )
        }
        /* Calendar-day difference (ignores time-of-day) so "due tomorrow" never
           gets bumped to "2 days" depending on what time it currently is. */
        function daysUntil(deadlineStr) {
            const parts = deadlineStr.split('-');
            const d = new Date(+parts[0], +parts[1] - 1, +parts[2]);
            const now = new Date();
            const nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            return Math.round((d - nowMid) / 86400000);
        }
        function urgencyClass(deadlineStr) {
            if (!deadlineStr) return 'due-ok';
            const diff = daysUntil(deadlineStr);
            if (diff < 0) return 'due-soon';
            if (diff <= 3) return 'due-soon';
            if (diff <= 7) return 'due-later';
            return 'due-ok'
        }
        function urgencyLabel(deadlineStr) {
            if (!deadlineStr) return '';
            const diff = daysUntil(deadlineStr);

        /* ── Details modal, tasks view, done-tracking ── */
        const TYPE_META = { assignment: ['bi-journal-text', 'Assignment'], event: ['bi-calendar-event', 'Event'], bring: ['bi-bag', 'Bring'], review: ['bi-book', 'Review / Study'] };
        function tk(e) { return e.type === 'reminder' ? (e.reminderKind === 'bring' ? 'bring' : 'review') : e.type }

        function doneSet() { try { return new Set(JSON.parse(localStorage.getItem('doneItems') || '[]')) } catch (e) { return new Set() } }

        function toggleBring(id,i,checked,box){const set=bringChecks(),key=`bring_${id}_${i}`;checked?set.add(key):set.delete(key);try{localStorage.setItem('bringChecks',JSON.stringify([...set]))}catch(e){};const label=box?.closest('label');const span=label?.querySelector('span');if(span){span.style.textDecoration=checked?'line-through':'none';span.style.opacity=checked?'.55':'1';}renderTasks();if(bottomView==='calendar')renderCalendar2();}

        function itemRow(e, pre) {

        function openItem(id) {

        function openClass(id, day, key) {

            const body = `<div style="height:4px;border-radius:4px;background:${c.color};margin-bottom:8px"></div>

              <div class="dm-h">Tasks for this class (${tasks.length})</div>${tasks.map(e => itemRow(e, 'c')).join('') || '<div style="font-size:12px;color:var(--muted)">Nothing pending.</div>'}

        function updateStats() {

            const over = t.filter(e => daysUntil(e.deadline) < 0).length, soon = t.filter(e => { const n = daysUntil(e.deadline); return n >= 0 && n <= 1 }).length;
            const h = (over ? `<button class="stat-chip c-red" onclick="setBottomView('tasks')"><i class="bi bi-exclamation-triangle"></i> ${over} overdue</button>` : '') + (soon ? `<button class="stat-chip c-amber" onclick="setBottomView('tasks')"><i class="bi bi-alarm"></i> ${soon} due soon</button>` : '');

            const tasks = all.filter(e => e.type !== 'event' && e.deadline && !done.has(e.id)).sort((a, b) => a.deadline < b.deadline ? -1 : 1);
            const groups = [['Overdue', tasks.filter(e => daysUntil(e.deadline) < 0)], ['Today', tasks.filter(e => daysUntil(e.deadline) === 0)], ['This week', tasks.filter(e => { const n = daysUntil(e.deadline); return n > 0 && n <= 7 })], ['Later', tasks.filter(e => daysUntil(e.deadline) > 7)],

        import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDk3u5hfhqe-X76lbWqDX-HIJVvrCHW0",
            authDomain: "schedule-3f07b.firebaseapp.com",
            projectId: "schedule-3f07b",
            storageBucket: "schedule-3f07b.firebasestorage.app",
            messagingSenderId: "1018047030276",
            appId: "1:1018047030276:web:c88062d54ce42c77c60151",
            measurementId: "G-KCWEX6G7QF"
        };

        const app = initializeApp(firebaseConfig);
        // Local cache: events/subjects/sessions stay available with no internet
        const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

        // Keep a live-synced copy of all events in window._fbEvents
        try { window._fbEvents = JSON.parse(localStorage.getItem('cachedEvents') || '[]'); window._fbSubjects = JSON.parse(localStorage.getItem('cachedSubjects') || '[]'); window._fbSessions = JSON.parse(localStorage.getItem('cachedSessions') || '[]'); window._fbCancellations = JSON.parse(localStorage.getItem('cachedCancellations') || '[]'); window._fbDayClosures = JSON.parse(localStorage.getItem('cachedDayClosures') || '[]'); } catch(e) { window._fbEvents=[]; window._fbSubjects=[]; window._fbSessions=[]; window._fbCancellations=[]; window._fbDayClosures=[]; }

        const q = query(collection(db, "events"), orderBy("createdAt", "asc"));
        onSnapshot(q, (snapshot) => {
            window._fbEvents = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            // Re-render the schedule list whenever Firestore data changes
            if (typeof refresh === 'function') refresh();
            try { localStorage.setItem('cachedEvents', JSON.stringify(window._fbEvents || [])); } catch(e) {}
            if (typeof renderTasks === 'function') renderTasks();
            if (typeof renderWeekGrid === 'function') renderWeekGrid();
            if (typeof renderCalendar2 === 'function' && typeof bottomView !== 'undefined' && bottomView === 'calendar') renderCalendar2();
        }, (err) => {
            console.warn("Firestore sync error:", err.message);

        // Subjects collection: lets admin.html override desc/color and add instructor info
        const qSub = query(collection(db, "subjects"), orderBy("courseId", "asc"));
        onSnapshot(qSub, (snapshot) => {
            window._fbSubjects = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            try { localStorage.setItem('cachedSubjects', JSON.stringify(window._fbSubjects || [])); } catch(e) {}
            if (typeof refresh === 'function') refresh();
            if (typeof renderTasks === 'function') renderTasks();
            if (typeof renderWeekGrid === 'function') renderWeekGrid();
        }, (err) => {
            console.warn("Firestore subjects sync error:", err.message);
        });

        // Sessions collection: lets admin.html override a class's day/time/room,
        // cancel a session, or add a brand-new one that isn't in the hardcoded timetable.
        const qSess = collection(db, "sessions");
        onSnapshot(qSess, (snapshot) => {
            window._fbSessions = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            try { localStorage.setItem('cachedSessions', JSON.stringify(window._fbSessions || [])); } catch(e) {}
            if (typeof refresh === 'function') refresh();
            if (typeof renderTasks === 'function') renderTasks();
            if (typeof renderWeekGrid === 'function') renderWeekGrid();
            if (typeof renderCalendar2 === 'function' && typeof bottomView !== 'undefined' && bottomView === 'calendar') renderCalendar2();

            console.warn("Firestore sessions sync error:", err.message);

        // Date-specific class cancellations. These never disable the recurring weekly session.
        onSnapshot(collection(db, "sessionCancellations"), (snapshot) => {
            window._fbCancellations = snapshot.docs.map(d => ({ id:d.id, ...d.data() }));
            try { localStorage.setItem('cachedCancellations', JSON.stringify(window._fbCancellations || [])); } catch(e) {}
            if (typeof refresh === 'function') refresh();
            if (typeof renderWeekGrid === 'function') renderWeekGrid();
